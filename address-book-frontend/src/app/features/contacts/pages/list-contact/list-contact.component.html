<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Contacts</h4>
    <div class="d-flex gap-2">
      <input class="form-control" type="search" placeholder="Search contacts..." style="width: 250px;" />
      <button class="btn btn-outline-primary">Import</button>
      <button class="btn btn-primary">Add contact</button>
    </div>
  </div>

  <div class="row">
    <app-filter-bar></app-filter-bar>
  </div>
  <div class="row g-3">
    <div class="col-md-6" *ngFor="let contact of contacts">
      <div class="card p-3 d-flex flex-row align-items-center">
        <div class="avatar-circle me-3" [ngStyle]="{ 'background-color': contact.color }">
          {{ contact.initials }}
        </div>
        <div>
          <h6 class="mb-1">{{ contact.name }}</h6>
          <p class="text-muted mb-1">{{ contact.title }}</p>
          <p class="mb-0"><i class="bi bi-envelope me-1"></i> {{ contact.email }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
