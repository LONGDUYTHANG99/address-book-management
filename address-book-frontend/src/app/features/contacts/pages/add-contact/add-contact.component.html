<div class="container mt-5">
  <!-- Header (with Image Binding) -->
  <div class="d-flex align-items-center mb-4">
    <div class="rounded-circle overflow-hidden bg-light border" style="width: 60px; height: 60px;">
      <img [src]="contact().image || 'https://via.placeholder.com/60'" alt="contact"
        class="w-100 h-100 object-fit-cover">
    </div>
    <h2 class="ms-3 mb-0">Contact</h2>
  </div>


  <!-- Contact Info Section -->
  <h5 class="mb-3">Contact Info</h5>

  <form (ngSubmit)="save()" #contactForm="ngForm">

    <!-- Hidden input for image string -->
    <input type="hidden" name="image" [(ngModel)]="contact().image" />

    <!--First Name-->
    <div class="row g-3">
      <div class="col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="firstName" name="firstName" [(ngModel)]="contact().firstName"
            required placeholder="First name">
          <label for="firstName">First name</label>
        </div>
      </div>

      <!--Last Name-->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="lastName" name="lastName" [(ngModel)]="contact().lastName"
            required placeholder="Last name">
          <label for="lastName">Last name <span class="text-danger">*</span></label>
        </div>
      </div>

      <!--Nick Name-->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="nickName" name="nickName" [(ngModel)]="contact().nickName"
            required placeholder="Nick name">
          <label for="NickName">Nick name <span class="text-danger">*</span></label>
        </div>
      </div>

      <!--Job Title-->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="jobTitle" name="jobTitle" [(ngModel)]="contact().jobTitle"
            placeholder="Job Title">
          <label for="jobTitle">Job Title</label>
        </div>
      </div>

      <!--Organization-->
      <div class="col-md-6">
        <div class="form-floating">
          <select class="form-select" id="organization" name="organization" [(ngModel)]="selectedOrganizationId">
            <option value="" disabled selected>Select organization</option>
            @for (o of organizations(); track o.id) {
            <option [value]="o.id">{{ o.name }}</option>
            }
          </select>
          <label for="organization">Organization</label>
        </div>
      </div>

      <!--Department-->
      <div class="col-md-6">
        <div class="form-floating">
          <select class="form-select" id="department" name="department" [(ngModel)]="contact().department">
            <option value="" disabled selected>Select Department</option>
            @for (d of masterMap()['Department']; track d.id) {
              <option [value]="d.typeKey">{{ d.typeValue }}</option>
            }
          </select>
          <label for="department">Department</label>
        </div>
      </div>

      <!--Personal Email-->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="email" class="form-control" id="personalEmail" name="personalEmail"
            [(ngModel)]="contact().personalEmail" placeholder="Personal Email">
          <label for="personalEmail">Personal Email</label>
        </div>
      </div>

      <!--Work Email-->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="email" class="form-control" id="workEmail" name="workEmail" [(ngModel)]="contact().workEmail"
            placeholder="Work email">
          <label for="workEmail">Work email</label>
        </div>
      </div>

      <!--BirthDay-->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="date" class="form-control" id="birthday" name="birthday" [(ngModel)]="contact().birthday"
            placeholder="Birthday">
          <label for="birthday">BirthDay</label>
        </div>
      </div>

      <!--Gender-->
      <div class="col-md-6">
        <div class="form-floating">
          <select class="form-select" id="gender" name="gender" [(ngModel)]="contact().gender">
            <option value="" disabled selected>Select gender</option>
            @for (g of masterMap()['Gender']; track g.id) {
              <option [value]="g.typeKey">{{ g.typeValue }}</option>
            }
          </select>
          <label for="gender">Gender</label>
        </div>
      </div>

      <!--Group-->
      <div class="col-md-6">
        <div class="form-floating">
          <select class="form-select" id="group" name="group" [(ngModel)]="contact().group">
            <option value="" disabled selected>Select group</option>
            @for (g of masterMap()['Group']; track g.id) {
              <option [value]="g.typeKey">{{ g.typeValue }}</option>
            }
          </select>
          <label for="group">Group</label>
        </div>
      </div>

      <!--Relationship-->
      <div class="col-md-6">
        <div class="form-floating">
          <select class="form-select" id="relationship" name="relationship" [(ngModel)]="contact().relationship">
            <option value="" disabled selected>Select relationship</option>
            @for (r of masterMap()['Relationship']; track r.id) {
              <option [value]="r.typeKey">{{ r.typeValue }}</option>
            }
          </select>
          <label for="relationship">Relationship</label>
        </div>
      </div>

      <!--Home Addrress-->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="homeAddress" name="homeAddress" [(ngModel)]="contact().homeAdress"
            placeholder="Home Address">
          <label for="homeAddress">Home Address</label>
        </div>
      </div>

      <!--Work Arress-->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="workAddress" name="workAddress" [(ngModel)]="contact().workAdress"
            placeholder="Work Address">
          <label for="workAddress">Work Address</label>
        </div>
      </div>
      
    </div>

    <!-- Phone Numbers Section -->
    <app-phone-section [readonlyPhoneTypes]="phoneTypes()" [readonlyContact]="contact()"></app-phone-section>

    <!-- Websites Section -->
    <app-website-section [readonlyWebsiteTypes]="websiteTypes()" [readonlyContact]="contact()"></app-website-section>
    <!-- Action Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-save me-1"></i> Save & Close
      </button>
      <div class="btn-group">
        <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-three-dots-vertical"></i> More
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#">Duplicate</a></li>
          <li><a class="dropdown-item" href="#">Archive</a></li>
        </ul>
      </div>
    </div>
  </form>
</div>
