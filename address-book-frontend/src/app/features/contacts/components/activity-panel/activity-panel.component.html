<div class="card mb-4 border-0 border-start border-end border-2 rounded-0">
  <div class="card-body">
    <!-- Header -->
    <div class="d-flex align-items-center mb-3">
      <i class="bi bi-clock text-secondary me-2" style="font-size: 20px;"></i>
      <h5 class="mb-0 text-secondary fw-normal">Activity</h5>
    </div>

    <!-- Tab Navigation -->
    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item" role="presentation">
        <a class="nav-link active" data-bs-toggle="tab" href="#tasks" role="tab"><span
            class="fw-semibold text-muted">Tasks</span></a>
      </li>
      <li class="nav-item" role="presentation">
        <a class="nav-link" data-bs-toggle="tab" href="#notes" role="tab"><span
            class="fw-semibold text-muted">Notes</span></a>
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content">
      <div class="tab-pane fade show active" id="tasks" role="tabpanel">
        <!-- Add Task Button -->
        <div class="d-flex justify-content-end mb-3">
          <button class="btn btn-info text-white btn-sm" data-bs-toggle="modal" data-bs-target="#taskModal"><i class="bi bi-plus-circle me-1"></i> Add Tasks</button>
        </div>

        <!-- Task Items -->
        <div class="d-flex flex-column gap-3">

          <div class="d-flex align-items-start border-start border-4 border-warning ps-3">
            <input type="checkbox" class="form-check-input me-2 mt-1">
            <div>
              <div class="fw-medium">Email <i class="bi bi-bell ms-1 text-muted"></i></div>
              <div class="text-muted small">Today, 11:27 PM</div>
            </div>
          </div>

          <div class="d-flex align-items-start border-start border-4 border-warning ps-3">
            <input type="checkbox" class="form-check-input me-2 mt-1">
            <div>
              <div class="fw-medium">Todo <i class="bi bi-bell ms-1 text-muted"></i></div>
              <div class="text-muted small">Today, 11:27 PM</div>
            </div>
          </div>

        </div>
      </div>

      <!--Note tab-->
      <div class="tab-pane fade" id="notes" role="tabpanel">
        <div class="d-flex justify-content-end mb-3">
          <button class="btn btn-info text-white btn-sm" data-bs-toggle="modal" data-bs-target="#noteModal">
            Add Note
          </button>
        </div>


        <div class="position-relative border-start border-2 ps-3">
          <h6 class="fw-semibold text-secondary">Nothing</h6>
          <small class="text-muted">Sat Jun 7, 9:06 PM by <span class="text-info">you</span></small>

          <!-- Edit Icon -->
          <i class="bi bi-pencil-fill position-absolute top-0 end-0 text-info me-2" style="cursor: pointer;"></i>
        </div>
      </div>

      <!--Note Modal-->
      <div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 rounded shadow">

            <div class="modal-body">
              <input type="text" class="form-control form-control-lg border-0 fw-bold text-muted mb-2"
                placeholder="Title" style="font-size: 1.25rem;">
              <hr class="mt-0">
              <textarea class="form-control border-0 shadow-none text-muted flex-grow-1" placeholder="Add a note"
                style="resize: none;"></textarea>
            </div>

            <div class="modal-footer border-0 d-flex justify-content-between">
              <button type="button" class="btn btn-link text-info" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-info text-white px-4">Save</button>
            </div>

          </div>
        </div>
      </div>

      <!-- Task Modal -->
      <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 rounded shadow">

            <div class="modal-body">

              <!-- Title input -->
              <input type="text" class="form-control form-control-lg border-0 fw-bold text-muted mb-2"
                placeholder="Title" style="font-size: 1.25rem;">
              <hr class="mt-0">

              <!-- Add to -->
              <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-person me-2 text-muted"></i>
                  <span>Add to</span>
                </div>
                <div class="d-flex align-items-center">
                  <span class="badge bg-primary me-2">P</span>
                  <span class="text-muted">Pobuca (SAMPLE)</span>
                  <i class="bi bi-x ms-2 text-danger" style="cursor: pointer;"></i>
                </div>
              </div>

              <!-- Type -->
              <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-flag me-2 text-muted"></i>
                  <span>Type</span>
                </div>
                <span class="text-info">Email</span>
              </div>

              <!-- Email -->
              <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-envelope me-2 text-muted"></i>
                  <span>Choose email</span>
                </div>
                <span class="text-info">hello</span>
              </div>

              <!-- Due -->
              <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-calendar-event me-2 text-muted"></i>
                  <span>Due</span>
                </div>
                <span class="text-info">Today, 1:45 PM</span>
              </div>

              <!-- Reminder -->
              <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-bell me-2 text-muted"></i>
                  <span>Remind</span>
                </div>
                <span class="text-info"><i class="bi bi-exclamation-circle me-1"></i>10 mins before</span>
              </div>

              <!-- Notes -->
              <div class="d-flex align-items-start mb-3">
                <i class="bi bi-pencil me-2 text-muted"></i>
                <textarea class="form-control border-0 shadow-none text-muted flex-grow-1" placeholder="Notes"
                  style="resize: none;"></textarea>
              </div>

            </div>

            <div class="modal-footer border-0 d-flex justify-content-between">
              <button type="button" class="btn btn-link text-info" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-info text-white px-4">Add</button>
            </div>

          </div>
        </div>
      </div>


    </div>
  </div>
</div>
