<div class="card p-3 d-flex flex-row align-items-center shadow-sm border-0 rounded-4">

  <!-- Favorite Star Button -->
  <button class="btn btn-sm position-absolute top-0 end-0 m-2 rounded-circle"
          [ngClass]="contact().isFavourite ? 'btn-warning' : 'btn-outline-warning'"
          (click)="toggleFavorite()"
          title="Toggle Favorite">
    <i class="bi" [ngClass]="contact().isFavourite ? 'bi-star-fill' : 'bi-star'"></i>
  </button>
  <div class="avatar-circle me-3 flex-shrink-0">
    <img [src]="contact().image || 'https://via.placeholder.com/60'" alt="contact"
         class="rounded-circle border object-fit-cover" style="width: 60px; height: 60px;">
  </div>
  <div>
    <h6 class="mb-1 fw-semibold text-dark">{{ contact().lastName }}</h6>
    <p class="text-muted mb-1 small">{{ contact().jobTitle }}</p>
    <p class="mb-0 text-secondary small">
      <i class="bi bi-envelope me-1 text-primary"></i>{{ contact().personalEmail }}
    </p>
  </div>
</div>
